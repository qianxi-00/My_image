<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0f172a"/>
  <text x="48" y="48" fill="#e2e8f0" font-size="26" font-family="Noto Sans SC, sans-serif" font-weight="700">Decision Transformer 总览：把轨迹当序列来生成动作</text>
  <text x="48" y="82" fill="#94a3b8" font-size="16" font-family="Noto Sans SC, sans-serif">核心对象：Return-to-Go · 状态 · 动作 · 因果 Transformer · 条件生成</text>
  <rect x="48" y="120" width="200" height="90" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="68" y="158" fill="#38bdf8" font-size="18" font-family="Noto Sans SC, sans-serif" font-weight="700">离线轨迹数据</text>
  <text x="68" y="186" fill="#cbd5e1" font-size="14" font-family="Noto Sans SC, sans-serif">(s, a, r) 历史片段</text>
  <path d="M248 165 H300" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="300" y="120" width="220" height="90" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="320" y="158" fill="#a78bfa" font-size="18" font-family="Noto Sans SC, sans-serif" font-weight="700">序列化重写</text>
  <text x="320" y="186" fill="#cbd5e1" font-size="14" font-family="Noto Sans SC, sans-serif">R̂t, st, at 交错 token</text>
  <path d="M520 165 H572" stroke="#64748b" stroke-width="3"/>
  <rect x="572" y="120" width="240" height="90" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="592" y="158" fill="#34d399" font-size="18" font-family="Noto Sans SC, sans-serif" font-weight="700">因果 Transformer</text>
  <text x="592" y="186" fill="#cbd5e1" font-size="14" font-family="Noto Sans SC, sans-serif">自回归预测下一步动作</text>
  <rect x="48" y="260" width="864" height="220" rx="16" fill="#111827" stroke="#334155"/>
  <text x="72" y="300" fill="#f8fafc" font-size="18" font-family="Noto Sans SC, sans-serif" font-weight="700">与经典 RL 的关键差异</text>
  <text x="72" y="340" fill="#cbd5e1" font-size="15" font-family="Noto Sans SC, sans-serif">1. 不显式学 Q/V，也不做策略梯度；把控制问题改写成条件序列建模</text>
  <text x="72" y="375" fill="#cbd5e1" font-size="15" font-family="Noto Sans SC, sans-serif">2. Return-to-Go 充当“目标回报提示”，在生成阶段指定想要的累计回报</text>
  <text x="72" y="410" fill="#cbd5e1" font-size="15" font-family="Noto Sans SC, sans-serif">3. 训练目标更接近监督学习：最小化动作预测误差，降低 bootstrapping 不稳定</text>
  <text x="72" y="445" fill="#cbd5e1" font-size="15" font-family="Noto Sans SC, sans-serif">4. 强依赖数据覆盖：轨迹库决定策略上界，外推高回报时容易退化为模仿学习</text>
</svg>
