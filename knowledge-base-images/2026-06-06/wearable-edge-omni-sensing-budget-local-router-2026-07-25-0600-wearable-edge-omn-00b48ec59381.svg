  <path d="M308 300 H350" stroke="url(#g1)" stroke-width="3"/>
  <path d="M610 300 H652" stroke="url(#g1)" stroke-width="3"/>
  <text x="48" y="510" fill="#64748b" font-size="13" font-family="Arial, sans-serif">核心原则：默认本地、按需上云、高风险确认、感知按预算计费</text>
