<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="28" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">系统—模型协同设计闭环</text>
  <text x="600" y="82" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">推理引擎 / 调度 / 缓存约束反向塑造可服务模型结构</text>

  <rect x="80" y="140" width="220" height="120" rx="16" fill="#1d4ed8" opacity="0.9"/>
  <text x="190" y="190" text-anchor="middle" fill="#fff" font-size="20" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">服务目标</text>
  <text x="190" y="220" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">TTFT / TPOT / 成本</text>
  <text x="190" y="242" text-anchor="middle" fill="#dbeafe" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">显存 / 吞吐 / SLO</text>

  <rect x="380" y="140" width="220" height="120" rx="16" fill="#7c3aed" opacity="0.9"/>
  <text x="490" y="190" text-anchor="middle" fill="#fff" font-size="20" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">引擎约束</text>
  <text x="490" y="220" text-anchor="middle" fill="#ede9fe" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">KV 分页 / 批调度</text>
  <text x="490" y="242" text-anchor="middle" fill="#ede9fe" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">专家并行 / 内核形状</text>

  <rect x="680" y="140" width="220" height="120" rx="16" fill="#059669" opacity="0.9"/>
  <text x="790" y="190" text-anchor="middle" fill="#fff" font-size="20" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">结构选择</text>
  <text x="790" y="220" text-anchor="middle" fill="#d1fae5" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">GQA/MLA / MoE 拓扑</text>
  <text x="790" y="242" text-anchor="middle" fill="#d1fae5" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">共享专家 / 稠密层</text>

  <rect x="980" y="140" width="160" height="120" rx="16" fill="#b45309" opacity="0.95"/>
  <text x="1060" y="190" text-anchor="middle" fill="#fff" font-size="20" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">验证</text>
  <text x="1060" y="220" text-anchor="middle" fill="#ffedd5" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">质量+延迟</text>
  <text x="1060" y="242" text-anchor="middle" fill="#ffedd5" font-size="14" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">回滚门槛</text>

  <line x1="300" y1="200" x2="370" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="670" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="200" x2="970" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <path d="M1060,270 C1060,360 190,360 190,270" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="600" y="350" text-anchor="middle" fill="#38bdf8" font-size="15" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">线上指标回流 → 下一轮结构改版</text>

  <rect x="100" y="420" width="1000" height="200" rx="18" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="600" y="460" text-anchor="middle" fill="#e2e8f0" font-size="18" font-family="Noto Sans CJK SC, PingFang SC, sans-serif" font-weight="700">关键原则：模型结构是服务接口的一部分，而不是训练目标的附属品</text>
  <text x="140" y="510" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">1. 先写清 SLO 与资源账单，再定层宽、头数、专家数与激活度</text>
  <text x="140" y="545" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">2. 优先改「引擎友好」结构（KV 压缩、可批路由、稳定专家工作集）</text>
  <text x="140" y="580" fill="#cbd5e1" font-size="15" font-family="Noto Sans CJK SC, PingFang SC, sans-serif">3. 任何结构变更必须同时通过质量回归与服务压测两道门</text>
</svg>
