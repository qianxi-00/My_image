<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2563eb"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <style>
      .t{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .s{font-size:22px;font-weight:700}
      .b{font-size:16px;font-weight:700}
      .m{font-size:14px;fill:#334155}
      .w{fill:#fff;font-size:14px;font-weight:600}
      .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:12}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text class="t s" x="40" y="42">投机解码一轮：草稿 → 并行验证 → 接受/回滚 KV</text>
  <text class="t m" x="40" y="72">假设草稿提出 5 个候选 token，目标模型一次前向验证，第 4 个被拒绝</text>

  <rect class="box" x="40" y="100" width="1120" height="150"/>
  <text class="t b" x="60" y="135">步骤 1：Draft 生成候选序列</text>
  <rect x="60" y="155" width="120" height="55" rx="8" fill="url(#g1)"/><text class="w" x="95" y="188">t1</text>
  <rect x="200" y="155" width="120" height="55" rx="8" fill="url(#g1)"/><text class="w" x="235" y="188">t2</text>
  <rect x="340" y="155" width="120" height="55" rx="8" fill="url(#g1)"/><text class="w" x="375" y="188">t3</text>
  <rect x="480" y="155" width="120" height="55" rx="8" fill="url(#g1)"/><text class="w" x="515" y="188">t4</text>
  <rect x="620" y="155" width="120" height="55" rx="8" fill="url(#g1)"/><text class="w" x="655" y="188">t5</text>
  <text class="t m" x="770" y="175">草稿侧维护自己的临时 KV</text>
  <text class="t m" x="770" y="205">目标侧此时尚未写入这些 token</text>

  <rect class="box" x="40" y="275" width="1120" height="170"/>
  <text class="t b" x="60" y="310">步骤 2：Target 一次前向并行验证</text>
  <text class="t m" x="60" y="345">对 [t1..t5] 做 tree/path 并行 attention，得到与自回归等价的接受判定</text>
  <rect x="60" y="365" width="180" height="48" rx="8" fill="url(#g2)"/><text class="w" x="105" y="395">接受 t1</text>
  <rect x="260" y="365" width="180" height="48" rx="8" fill="url(#g2)"/><text class="w" x="305" y="395">接受 t2</text>
  <rect x="460" y="365" width="180" height="48" rx="8" fill="url(#g2)"/><text class="w" x="505" y="395">接受 t3</text>
  <rect x="660" y="365" width="180" height="48" rx="8" fill="url(#g3)"/><text class="w" x="705" y="395">拒绝 t4</text>
  <rect x="860" y="365" width="180" height="48" rx="8" fill="#e2e8f0"/><text class="t m" x="905" y="395">丢弃 t5</text>

  <rect class="box" x="40" y="470" width="1120" height="190"/>
  <text class="t b" x="60" y="505">步骤 3：KV 写入与回滚边界</text>
  <text class="t m" x="60" y="540">目标 KV：追加 t1、t2、t3 对应状态；t4 及之后的临时状态全部回滚</text>
  <text class="t m" x="60" y="570">草稿 KV：可整体截断到接受边界，或直接重建；不得把草稿 KV 直接并入目标</text>
  <text class="t m" x="60" y="600">bonus token：拒绝点处通常还会由目标模型采样 1 个确定 token，并写入目标 KV</text>
  <text class="t m" x="60" y="630">收益来源：目标模型前向从 5 次降为 1 次；成本来源：草稿计算 + 验证带宽 + 回滚管理</text>
  <text class="t m" x="60" y="660">正确性约束：接受边界之前的输出分布必须与普通自回归 decode 保持一致</text>
</svg>
