<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0B1220"/>
  <text x="40" y="48" fill="#E2E8F0" font-size="26" font-family="sans-serif">场景矩阵：何时必须上工作记忆，而不是加长上下文</text>
  <g font-family="sans-serif" font-size="15">
    <rect x="40" y="90" width="280" height="180" rx="14" fill="#1E293B" stroke="#38BDF8"/>
    <text x="60" y="125" fill="#7DD3FC">监控/安防</text>
    <text x="60" y="160" fill="#E2E8F0">持续数小时</text>
    <text x="60" y="190" fill="#E2E8F0">偶发关键事件</text>
    <text x="60" y="220" fill="#E2E8F0">要可回放时间戳</text>
    <rect x="340" y="90" width="280" height="180" rx="14" fill="#1E293B" stroke="#34D399"/>
    <text x="360" y="125" fill="#6EE7B7">产线/质检</text>
    <text x="360" y="160" fill="#E2E8F0">多摄像头同步</text>
    <text x="360" y="190" fill="#E2E8F0">缺陷要绑定工单</text>
    <text x="360" y="220" fill="#E2E8F0">动作提交需门控</text>
    <rect x="640" y="90" width="280" height="180" rx="14" fill="#1E293B" stroke="#FBBF24"/>
    <text x="660" y="125" fill="#FDE68A">远程协作</text>
    <text x="660" y="160" fill="#E2E8F0">语音+画面指代</text>
    <text x="660" y="190" fill="#E2E8F0">“刚才那个螺丝”</text>
    <text x="660" y="220" fill="#E2E8F0">跨分钟引用</text>
    <rect x="40" y="300" width="280" height="180" rx="14" fill="#1E293B" stroke="#C084FC"/>
    <text x="60" y="335" fill="#E9D5FF">零售货架</text>
    <text x="60" y="370" fill="#E2E8F0">商品状态漂移</text>
    <text x="60" y="400" fill="#E2E8F0">补货事件累积</text>
    <text x="60" y="430" fill="#E2E8F0">低价值帧可遗忘</text>
    <rect x="340" y="300" width="280" height="180" rx="14" fill="#1E293B" stroke="#FB7185"/>
    <text x="360" y="335" fill="#FECDD3">车载/机器人</text>
    <text x="360" y="370" fill="#E2E8F0">延迟硬约束</text>
    <text x="360" y="400" fill="#E2E8F0">本地工作集优先</text>
    <text x="360" y="430" fill="#E2E8F0">云端只收证据卡</text>
    <rect x="640" y="300" width="280" height="180" rx="14" fill="#1E293B" stroke="#94A3B8"/>
    <text x="660" y="335" fill="#CBD5E1">客服双录</text>
    <text x="660" y="370" fill="#E2E8F0">音画合规留痕</text>
    <text x="660" y="400" fill="#E2E8F0">争议回放</text>
    <text x="660" y="430" fill="#E2E8F0">证据哈希上链/入库</text>
  </g>
</svg>
