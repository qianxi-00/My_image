  <rect x="290" y="120" width="160" height="70" rx="10" fill="#1e3a5f"/>
  <text x="330" y="160" fill="#e2e8f0" font-size="16" font-family="sans-serif">预热任务</text>
  <rect x="500" y="120" width="160" height="70" rx="10" fill="#1e3a5f"/>
  <text x="540" y="160" fill="#e2e8f0" font-size="16" font-family="sans-serif">就绪门禁</text>
