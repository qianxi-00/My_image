<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="60" y="70" fill="#f1f5f9" font-size="32" font-family="sans-serif" font-weight="700">三层确认通道：语音 / 触感 / 视觉微交互</text>
  <text x="60" y="110" fill="#94a3b8" font-size="18" font-family="sans-serif">同一 Commit Token，跨通道可验证、可审计、可超时作废</text>
  <rect x="70" y="170" width="320" height="420" rx="18" fill="#111827" stroke="#0ea5e9"/>
  <text x="100" y="220" fill="#38bdf8" font-size="26" font-family="sans-serif" font-weight="700">语音通道</text>
  <text x="100" y="280" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 摘要复述确认</text>
  <text x="100" y="330" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 短命令：确认/取消</text>
  <text x="100" y="380" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 高风险挑战短语</text>
  <text x="100" y="430" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 说话人校验</text>
  <text x="100" y="500" fill="#64748b" font-size="16" font-family="sans-serif">适合双手占用场景</text>
  <rect x="440" y="170" width="320" height="420" rx="18" fill="#111827" stroke="#a78bfa"/>
  <text x="470" y="220" fill="#c4b5fd" font-size="26" font-family="sans-serif" font-weight="700">触感通道</text>
  <text x="470" y="280" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 耳机捏合/双击</text>
  <text x="470" y="330" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 表冠/戒指确认</text>
  <text x="470" y="380" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 振动编码回执</text>
  <text x="470" y="430" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 防误触时间窗</text>
  <text x="470" y="500" fill="#64748b" font-size="16" font-family="sans-serif">适合嘈杂与隐私场景</text>
  <rect x="810" y="170" width="320" height="420" rx="18" fill="#111827" stroke="#34d399"/>
  <text x="840" y="220" fill="#6ee7b7" font-size="26" font-family="sans-serif" font-weight="700">视觉通道</text>
  <text x="840" y="280" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 眼镜 HUD 卡片</text>
  <text x="840" y="330" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 高亮关键字段</text>
  <text x="840" y="380" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 点头/注视确认</text>
  <text x="840" y="430" fill="#e2e8f0" font-size="18" font-family="sans-serif">• 倒计时进度条</text>
  <text x="840" y="500" fill="#64748b" font-size="16" font-family="sans-serif">适合金额/联系人核对</text>
  <text x="60" y="650" fill="#94a3b8" font-size="18" font-family="sans-serif">工程要点：通道可组合，但 Commit Token 只能消费一次；跨设备接力时必须迁移同一 token 与风险等级。</text>
</svg>
