<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0f172a"/>
  <text x="40" y="44" fill="#e2e8f0" font-size="20" font-family="sans-serif">GitOps Delivery Loop for Signed Model Artifacts</text>
  <rect x="50" y="100" width="180" height="100" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="75" y="145" fill="#7dd3fc" font-size="15" font-family="sans-serif">CI Build</text>
  <text x="70" y="170" fill="#94a3b8" font-size="12" font-family="sans-serif">export + oras push</text>
  <rect x="280" y="100" width="180" height="100" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="310" y="145" fill="#ddd6fe" font-size="15" font-family="sans-serif">Sign Gate</text>
  <text x="300" y="170" fill="#94a3b8" font-size="12" font-family="sans-serif">cosign sign-blob</text>
  <rect x="510" y="100" width="180" height="100" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="545" y="145" fill="#a7f3d0" font-size="15" font-family="sans-serif">GitOps PR</text>
  <text x="530" y="170" fill="#94a3b8" font-size="12" font-family="sans-serif">digest pin only</text>
  <rect x="740" y="100" width="170" height="100" rx="10" fill="#1e293b" stroke="#fbbf24"/>
  <text x="775" y="145" fill="#fde68a" font-size="15" font-family="sans-serif">Cluster</text>
  <text x="755" y="170" fill="#94a3b8" font-size="12" font-family="sans-serif">pull + verify</text>
  <path d="M230 150 H280" stroke="#64748b" stroke-width="2"/>
  <path d="M460 150 H510" stroke="#64748b" stroke-width="2"/>
  <path d="M690 150 H740" stroke="#64748b" stroke-width="2"/>
  <rect x="80" y="280" width="800" height="180" rx="12" fill="#111827" stroke="#334155"/>
  <text x="110" y="330" fill="#e2e8f0" font-size="16" font-family="sans-serif">Failure modes &amp; mitigations</text>
  <text x="110" y="365" fill="#94a3b8" font-size="14" font-family="sans-serif">1) mutable tags → always pin digest + cosign verify</text>
  <text x="110" y="395" fill="#94a3b8" font-size="14" font-family="sans-serif">2) giant layer invalidation → split base/adapter layers</text>
  <text x="110" y="425" fill="#94a3b8" font-size="14" font-family="sans-serif">3) registry rate limit → regional mirror + node-local cache</text>
</svg>
