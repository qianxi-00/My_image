<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" fill="#f8fafc" font-size="28" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">网关路由决策矩阵：质量—成本—风险三维</text>
  <rect x="90" y="100" width="1020" height="80" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="600" y="135" text-anchor="middle" fill="#e2e8f0" font-size="20" font-family="Noto Sans CJK SC, sans-serif">输入特征：任务类型 · 上下文长度 · 工具需求 · 租户等级 · 实时 SLO · 合规标签</text>
  <text x="600" y="165" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="Noto Sans CJK SC, sans-serif">输出：后端模型 + 策略（缓存 / 降级 / 双跑 / 人工复核）</text>
  <rect x="90" y="220" width="300" height="360" rx="14" fill="#0c4a6e"/>
  <text x="240" y="260" text-anchor="middle" fill="#7dd3fc" font-size="22" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">质量轴</text>
  <text x="240" y="310" text-anchor="middle" fill="#e0f2fe" font-size="17" font-family="Noto Sans CJK SC, sans-serif">推理深度</text>
  <text x="240" y="345" text-anchor="middle" fill="#e0f2fe" font-size="17" font-family="Noto Sans CJK SC, sans-serif">领域准确率</text>
  <text x="240" y="380" text-anchor="middle" fill="#e0f2fe" font-size="17" font-family="Noto Sans CJK SC, sans-serif">格式与工具成功率</text>
  <text x="240" y="415" text-anchor="middle" fill="#e0f2fe" font-size="17" font-family="Noto Sans CJK SC, sans-serif">长上下文召回</text>
  <text x="240" y="470" text-anchor="middle" fill="#bae6fd" font-size="16" font-family="Noto Sans CJK SC, sans-serif">高：巨型 / 专用强模型</text>
  <text x="240" y="505" text-anchor="middle" fill="#bae6fd" font-size="16" font-family="Noto Sans CJK SC, sans-serif">中：蒸馏中型模型</text>
  <text x="240" y="540" text-anchor="middle" fill="#bae6fd" font-size="16" font-family="Noto Sans CJK SC, sans-serif">低：规则 / 小模型</text>
  <rect x="450" y="220" width="300" height="360" rx="14" fill="#3b0764"/>
  <text x="600" y="260" text-anchor="middle" fill="#d8b4fe" font-size="22" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">成本轴</text>
  <text x="600" y="310" text-anchor="middle" fill="#f3e8ff" font-size="17" font-family="Noto Sans CJK SC, sans-serif">单位 token 算力</text>
  <text x="600" y="345" text-anchor="middle" fill="#f3e8ff" font-size="17" font-family="Noto Sans CJK SC, sans-serif">KV / 缓存占用</text>
  <text x="600" y="380" text-anchor="middle" fill="#f3e8ff" font-size="17" font-family="Noto Sans CJK SC, sans-serif">冷启动与副本数</text>
  <text x="600" y="415" text-anchor="middle" fill="#f3e8ff" font-size="17" font-family="Noto Sans CJK SC, sans-serif">失败重试开销</text>
  <text x="600" y="470" text-anchor="middle" fill="#e9d5ff" font-size="16" font-family="Noto Sans CJK SC, sans-serif">优先：命中缓存路径</text>
  <text x="600" y="505" text-anchor="middle" fill="#e9d5ff" font-size="16" font-family="Noto Sans CJK SC, sans-serif">其次：小模型 + 验证</text>
  <text x="600" y="540" text-anchor="middle" fill="#e9d5ff" font-size="16" font-family="Noto Sans CJK SC, sans-serif">最后：上调到大模型</text>
  <rect x="810" y="220" width="300" height="360" rx="14" fill="#7f1d1d"/>
  <text x="960" y="260" text-anchor="middle" fill="#fecaca" font-size="22" font-family="Noto Sans CJK SC, sans-serif" font-weight="700">风险轴</text>
  <text x="960" y="310" text-anchor="middle" fill="#fee2e2" font-size="17" font-family="Noto Sans CJK SC, sans-serif">安全越狱概率</text>
  <text x="960" y="345" text-anchor="middle" fill="#fee2e2" font-size="17" font-family="Noto Sans CJK SC, sans-serif">幻觉业务后果</text>
  <text x="960" y="380" text-anchor="middle" fill="#fee2e2" font-size="17" font-family="Noto Sans CJK SC, sans-serif">数据隔离要求</text>
  <text x="960" y="415" text-anchor="middle" fill="#fee2e2" font-size="17" font-family="Noto Sans CJK SC, sans-serif">可审计性</text>
  <text x="960" y="470" text-anchor="middle" fill="#fecaca" font-size="16" font-family="Noto Sans CJK SC, sans-serif">高风险：受限路径</text>
  <text x="960" y="505" text-anchor="middle" fill="#fecaca" font-size="16" font-family="Noto Sans CJK SC, sans-serif">中风险：双跑 + 裁判</text>
  <text x="960" y="540" text-anchor="middle" fill="#fecaca" font-size="16" font-family="Noto Sans CJK SC, sans-serif">低风险：标准路由</text>
  <text x="600" y="640" text-anchor="middle" fill="#cbd5e1" font-size="18" font-family="Noto Sans CJK SC, sans-serif">三维冲突时：风险优先，其次质量门槛，再做成本优化</text>
  <text x="600" y="680" text-anchor="middle" fill="#64748b" font-size="16" font-family="Noto Sans CJK SC, sans-serif">模型网关把“架构选择”从离线评审变成在线策略执行</text>
</svg>
