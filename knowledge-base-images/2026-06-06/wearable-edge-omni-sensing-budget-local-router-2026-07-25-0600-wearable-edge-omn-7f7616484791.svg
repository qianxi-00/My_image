<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="960" height="560" rx="24" fill="url(#bg2)"/>
  <text x="48" y="56" fill="#f8fafc" font-size="26" font-family="Arial, sans-serif" font-weight="700">感知预算状态机 · Sensing Budget FSM</text>
  <text x="48" y="88" fill="#94a3b8" font-size="15" font-family="Arial, sans-serif">Idle → Alert → Capture → Reason → Act → Cool-down</text>
  <!-- states -->
  <g font-family="Arial, sans-serif">
    <rect x="40" y="150" width="130" height="70" rx="12" fill="#0ea5e9"/>
    <text x="75" y="192" fill="#fff" font-size="16" font-weight="700">Idle</text>
    <rect x="200" y="150" width="130" height="70" rx="12" fill="#22c55e"/>
    <text x="232" y="192" fill="#052e16" font-size="16" font-weight="700">Alert</text>
    <rect x="360" y="150" width="130" height="70" rx="12" fill="#eab308"/>
    <text x="385" y="192" fill="#422006" font-size="16" font-weight="700">Capture</text>
    <rect x="520" y="150" width="130" height="70" rx="12" fill="#a855f7"/>
    <text x="548" y="192" fill="#fff" font-size="16" font-weight="700">Reason</text>
    <rect x="680" y="150" width="130" height="70" rx="12" fill="#f43f5e"/>
    <text x="720" y="192" fill="#fff" font-size="16" font-weight="700">Act</text>
    <rect x="820" y="150" width="100" height="70" rx="12" fill="#64748b"/>
    <text x="835" y="192" fill="#fff" font-size="14" font-weight="700">Cool</text>
  </g>
  <path d="M170 185 H200 M330 185 H360 M490 185 H520 M650 185 H680 M810 185 H820" stroke="#cbd5e1" stroke-width="2" marker-end="url(#m)"/>
  <text x="48" y="280" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif" font-weight="700">预算维度</text>
  <rect x="48" y="300" width="270" height="180" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="68" y="340" fill="#93c5fd" font-size="15" font-family="Arial, sans-serif">功率预算 Power</text>
  <text x="68" y="370" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">mW·s / 会话 · 电池剩余</text>
  <text x="68" y="400" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">常开上限 &lt; 传感器配额</text>
  <text x="68" y="430" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif">超限：降采样 / 关相机</text>
  <rect x="345" y="300" width="270" height="180" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="365" y="340" fill="#86efac" font-size="15" font-family="Arial, sans-serif">隐私预算 Privacy</text>
  <text x="365" y="370" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">原始帧驻留时长</text>
  <text x="365" y="400" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">出设备字节 / 天</text>
  <text x="365" y="430" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif">超限：只传摘要令牌</text>
  <rect x="642" y="300" width="270" height="180" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="662" y="340" fill="#fcd34d" font-size="15" font-family="Arial, sans-serif">认知预算 Attention</text>
  <text x="662" y="370" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">打断次数 / 小时</text>
  <text x="662" y="400" fill="#cbd5e1" font-size="13" font-family="Arial, sans-serif">主动建议冷却窗口</text>
  <text x="662" y="430" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif">超限：静默聚合</text>
  <text x="48" y="520" fill="#64748b" font-size="13" font-family="Arial, sans-serif">路由只在预算允许时升级模态与模型；否则降级而非硬失败</text>
</svg>
