<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
  <rect width="960" height="520" fill="#0f172a"/>
  <text x="40" y="46" fill="#e2e8f0" font-size="22" font-family="sans-serif">多副本会话亲和与缓存一致性控制面</text>
  <rect x="60" y="90" width="180" height="70" rx="10" fill="#1e293b" stroke="#38bdf8"/>
  <text x="90" y="130" fill="#7dd3fc" font-size="15" font-family="sans-serif">API Gateway</text>
  <rect x="320" y="90" width="200" height="70" rx="10" fill="#1e293b" stroke="#a78bfa"/>
  <text x="350" y="130" fill="#c4b5fd" font-size="15" font-family="sans-serif">Affinity Router</text>
  <rect x="600" y="70" width="140" height="50" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="625" y="100" fill="#6ee7b7" font-size="13" font-family="sans-serif">Worker A</text>
  <rect x="780" y="70" width="140" height="50" rx="8" fill="#1e293b" stroke="#34d399"/>
  <text x="805" y="100" fill="#6ee7b7" font-size="13" font-family="sans-serif">Worker B</text>
  <rect x="600" y="150" width="140" height="50" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="625" y="180" fill="#fcd34d" font-size="13" font-family="sans-serif">Cache A</text>
  <rect x="780" y="150" width="140" height="50" rx="8" fill="#1e293b" stroke="#fbbf24"/>
  <text x="805" y="180" fill="#fcd34d" font-size="13" font-family="sans-serif">Cache B</text>
  <line x1="240" y1="125" x2="320" y2="125" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="125" x2="600" y2="95" stroke="#64748b" stroke-width="2"/>
  <line x1="520" y1="125" x2="780" y2="95" stroke="#64748b" stroke-width="2"/>
  <line x1="670" y1="120" x2="670" y2="150" stroke="#475569" stroke-width="2"/>
  <line x1="850" y1="120" x2="850" y2="150" stroke="#475569" stroke-width="2"/>
  <rect x="60" y="260" width="840" height="220" rx="14" fill="#111827" stroke="#334155"/>
  <text x="90" y="300" fill="#e2e8f0" font-size="16" font-family="sans-serif">控制面必须显式化的四个状态</text>
  <text x="90" y="340" fill="#94a3b8" font-size="14" font-family="sans-serif">1) 会话键 / 前缀指纹 → 目标 worker 映射</text>
  <text x="90" y="375" fill="#94a3b8" font-size="14" font-family="sans-serif">2) 租约 TTL 与热迁移条件（负载、显存、故障）</text>
  <text x="90" y="410" fill="#94a3b8" font-size="14" font-family="sans-serif">3) 缓存版本与 tokenizer/模型权重一致性校验</text>
  <text x="90" y="445" fill="#94a3b8" font-size="14" font-family="sans-serif">4) 驱逐、预热、跨节点复制的优先级队列</text>
</svg>
