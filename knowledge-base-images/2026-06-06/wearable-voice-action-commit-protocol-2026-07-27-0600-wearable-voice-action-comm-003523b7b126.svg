<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="60" y="70" fill="#e2e8f0" font-size="34" font-family="sans-serif" font-weight="700">可穿戴语音 Agent：从感知到动作提交</text>
  <text x="60" y="110" fill="#94a3b8" font-size="18" font-family="sans-serif">Listen → Understand → Risk Gate → Confirm → Commit → Audit</text>
  <!-- boxes -->
  <rect x="60" y="180" width="160" height="90" rx="14" fill="#0ea5e9" opacity="0.9"/>
  <text x="140" y="232" text-anchor="middle" fill="#0f172a" font-size="22" font-family="sans-serif" font-weight="700">音频感知</text>
  <rect x="250" y="180" width="160" height="90" rx="14" fill="#38bdf8" opacity="0.9"/>
  <text x="330" y="232" text-anchor="middle" fill="#0f172a" font-size="22" font-family="sans-serif" font-weight="700">意图理解</text>
  <rect x="440" y="180" width="160" height="90" rx="14" fill="#818cf8" opacity="0.95"/>
  <text x="520" y="222" text-anchor="middle" fill="#fff" font-size="20" font-family="sans-serif" font-weight="700">风险分级</text>
  <text x="520" y="248" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="sans-serif">Risk Gate</text>
  <rect x="630" y="180" width="160" height="90" rx="14" fill="#a78bfa"/>
  <text x="710" y="232" text-anchor="middle" fill="#0f172a" font-size="22" font-family="sans-serif" font-weight="700">确认协议</text>
  <rect x="820" y="180" width="160" height="90" rx="14" fill="#34d399"/>
  <text x="900" y="232" text-anchor="middle" fill="#0f172a" font-size="22" font-family="sans-serif" font-weight="700">动作提交</text>
  <rect x="1010" y="180" width="130" height="90" rx="14" fill="#fbbf24"/>
  <text x="1075" y="232" text-anchor="middle" fill="#0f172a" font-size="20" font-family="sans-serif" font-weight="700">审计</text>
  <!-- arrows -->
  <path d="M220 225 H250" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M410 225 H440" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M600 225 H630" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M790 225 H820" stroke="#cbd5e1" stroke-width="4"/>
  <path d="M980 225 H1010" stroke="#cbd5e1" stroke-width="4"/>
  <!-- lower cards -->
  <rect x="60" y="340" width="340" height="280" rx="18" fill="#111827" stroke="#334155"/>
  <text x="90" y="390" fill="#7dd3fc" font-size="24" font-family="sans-serif" font-weight="700">L0-L1 低风险</text>
  <text x="90" y="440" fill="#cbd5e1" font-size="18" font-family="sans-serif">查天气 / 设提醒 / 读摘要</text>
  <text x="90" y="480" fill="#94a3b8" font-size="18" font-family="sans-serif">可静默提交或轻提示</text>
  <text x="90" y="520" fill="#94a3b8" font-size="18" font-family="sans-serif">强调可撤销与可见反馈</text>
  <text x="90" y="560" fill="#64748b" font-size="16" font-family="sans-serif">端侧优先，默认本地闭环</text>
  <rect x="430" y="340" width="340" height="280" rx="18" fill="#111827" stroke="#334155"/>
  <text x="460" y="390" fill="#c4b5fd" font-size="24" font-family="sans-serif" font-weight="700">L2 中风险</text>
  <text x="460" y="440" fill="#cbd5e1" font-size="18" font-family="sans-serif">发消息 / 改日程 / 下单草稿</text>
  <text x="460" y="480" fill="#94a3b8" font-size="18" font-family="sans-serif">必须摘要确认 + 超时回退</text>
  <text x="460" y="520" fill="#94a3b8" font-size="18" font-family="sans-serif">支持点头/捏合/语音确认</text>
  <text x="460" y="560" fill="#64748b" font-size="16" font-family="sans-serif">近端协同，保留草稿态</text>
  <rect x="800" y="340" width="340" height="280" rx="18" fill="#111827" stroke="#334155"/>
  <text x="830" y="390" fill="#fcd34d" font-size="24" font-family="sans-serif" font-weight="700">L3-L4 高风险</text>
  <text x="830" y="440" fill="#cbd5e1" font-size="18" font-family="sans-serif">支付 / 删库 / 分享隐私</text>
  <text x="830" y="480" fill="#94a3b8" font-size="18" font-family="sans-serif">多因子确认 + 强制审计</text>
  <text x="830" y="520" fill="#94a3b8" font-size="18" font-family="sans-serif">禁止仅靠一次唤醒词提交</text>
  <text x="830" y="560" fill="#64748b" font-size="16" font-family="sans-serif">默认拒绝，显式授权才放行</text>
</svg>
