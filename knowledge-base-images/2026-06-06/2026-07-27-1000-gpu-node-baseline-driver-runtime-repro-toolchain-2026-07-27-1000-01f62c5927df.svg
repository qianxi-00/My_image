<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#0b1220"/>
  <text x="48" y="48" fill="#e2e8f0" font-size="24" font-family="DejaVu Sans, sans-serif" font-weight="700">节点基线变更门禁流水线</text>
  <text x="48" y="78" fill="#94a3b8" font-size="14" font-family="DejaVu Sans, sans-serif">Git 声明 → 构建镜像 → 金丝雀节点池 → 探针验收 → 滚动 → 证据归档</text>
  <!-- boxes -->
  <rect x="40" y="130" width="150" height="90" rx="10" fill="#14532d"/>
  <text x="55" y="175" fill="#dcfce7" font-size="15" font-family="DejaVu Sans, sans-serif">基线声明</text>
  <text x="55" y="198" fill="#86efac" font-size="12" font-family="DejaVu Sans, sans-serif">驱动/内核矩阵</text>
  <path d="M190 175 H230" stroke="#64748b" stroke-width="3"/>
  <polygon points="230,170 242,175 230,180" fill="#64748b"/>
  <rect x="242" y="130" width="150" height="90" rx="10" fill="#1e3a8a"/>
  <text x="257" y="175" fill="#dbeafe" font-size="15" font-family="DejaVu Sans, sans-serif">不可变构建</text>
  <text x="257" y="198" fill="#93c5fd" font-size="12" font-family="DejaVu Sans, sans-serif">OS+驱动+toolkit</text>
  <path d="M392 175 H432" stroke="#64748b" stroke-width="3"/>
  <polygon points="432,170 444,175 432,180" fill="#64748b"/>
  <rect x="444" y="130" width="150" height="90" rx="10" fill="#7c2d12"/>
  <text x="459" y="175" fill="#ffedd5" font-size="15" font-family="DejaVu Sans, sans-serif">金丝雀池</text>
  <text x="459" y="198" fill="#fdba74" font-size="12" font-family="DejaVu Sans, sans-serif">1-3 节点试跑</text>
  <path d="M594 175 H634" stroke="#64748b" stroke-width="3"/>
  <polygon points="634,170 646,175 634,180" fill="#64748b"/>
  <rect x="646" y="130" width="150" height="90" rx="10" fill="#4c1d95"/>
  <text x="661" y="175" fill="#ede9fe" font-size="15" font-family="DejaVu Sans, sans-serif">验收门禁</text>
  <text x="661" y="198" fill="#c4b5fd" font-size="12" font-family="DejaVu Sans, sans-serif">DCGM/烟测/兼容</text>
  <path d="M796 175 H820" stroke="#64748b" stroke-width="3"/>
  <polygon points="820,170 832,175 820,180" fill="#64748b"/>
  <rect x="832" y="130" width="100" height="90" rx="10" fill="#0f766e"/>
  <text x="848" y="182" fill="#ccfbf1" font-size="15" font-family="DejaVu Sans, sans-serif">全量</text>
  <!-- bottom failure path -->
  <rect x="180" y="300" width="600" height="180" rx="14" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="210" y="340" fill="#f87171" font-size="16" font-family="DejaVu Sans, sans-serif">常见硬失败（必须阻断发布）</text>
  <text x="210" y="375" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">1) nvidia-smi 与内核模块版本不一致</text>
  <text x="210" y="405" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">2) CDI/toolkit 注入设备失败，容器内不可见 GPU</text>
  <text x="210" y="435" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">3) 驱动升级后旧推理镜像 CUDA 用户态不兼容</text>
  <text x="210" y="465" fill="#cbd5e1" font-size="14" font-family="DejaVu Sans, sans-serif">4) 金丝雀池通过但生产池固件/BIOS 矩阵漂移</text>
</svg>
